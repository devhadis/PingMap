name: PingMap CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP - Laravel Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, pdo_sqlite, sqlite3, pdo_pgsql, intl, zip, bcmath, pcntl
          coverage: none
          tools: composer:v2

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compilar frontend
        run: npm run build

      - name: Executar testes Laravel
        run: php artisan test --no-ansi

  javascript-tests:
    name: JavaScript - Node Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Executar testes JavaScript
        run: node --test tests/js/*.test.mjs
